<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 680" width="100%" height="100%">
  <defs>
    <style>
      * {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* Base card drop shadow */
      .card-shadow {
        filter: drop-shadow(0 16px 36px rgba(15, 23, 42, 0.08));
      }

      .inner-shadow {
        filter: drop-shadow(0 4px 12px rgba(15, 23, 42, 0.04));
      }

      /* Subtle Hover / Floating Animations */
      @keyframes float-icon-1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3.5px); }
      }
      @keyframes float-icon-2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(3px); }
      }

      .float-1 { animation: float-icon-1 3.2s ease-in-out infinite; }
      .float-2 { animation: float-icon-2 3.8s ease-in-out infinite; }

      /* Star twinkle */
      @keyframes star-twinkle {
        0%, 100% {
          transform: scale(1) rotate(0deg);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.15) rotate(6deg);
          opacity: 1;
          filter: drop-shadow(0 0 8px rgba(13, 148, 136, 0.6));
        }
      }
      .twinkle {
        animation: star-twinkle 4s ease-in-out infinite;
        transform-origin: 746px 86px;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F0FDFA" />
    </linearGradient>

    <!-- Main Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDFEFE" />
    </linearGradient>

    <!-- Sub-card gradient -->
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- RxDesk App Icon Gradient (Clinical Blue to Teal) -->
    <linearGradient id="rx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3B74" />
      <stop offset="56%" stop-color="#0F67B4" />
      <stop offset="100%" stop-color="#0F8F8A" />
    </linearGradient>

    <!-- MorningStar Logo Gradient -->
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Badge Soft Gradients -->
    <linearGradient id="badge-green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8FDF3" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="badge-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="badge-orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="badge-purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>
    <linearGradient id="badge-amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Checkmark Circle -->
    <g id="check-icon">
      <circle cx="11" cy="11" r="11" fill="#0D9488" />
      <path d="M7 11.5L9.5 14L15 8.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Rust Icon Vector -->
    <g id="rust-logo">
      <circle cx="20" cy="20" r="18" fill="#FF7043" opacity="0.15" />
      <path d="M20 7C12.82 7 7 12.82 7 20C7 27.18 12.82 33 20 33C27.18 33 33 27.18 33 20C33 12.82 27.18 7 20 7ZM20 29.5C14.75 29.5 10.5 25.25 10.5 20C10.5 14.75 14.75 10.5 20 10.5C25.25 10.5 29.5 14.75 29.5 20C29.5 25.25 25.25 29.5 20 29.5Z" fill="#D35400"/>
      <path d="M17 14H23C24.66 14 26 15.34 26 17C26 18.23 25.26 19.29 24.19 19.74L26.5 24H23.5L21.5 20H19V24H17V14ZM19 16V18.5H23C23.83 18.5 24.5 17.83 24.5 17C24.5 16.17 23.83 15.5 23 15.5H19V16Z" fill="#A04000"/>
    </g>

    <!-- Tauri Icon Vector -->
    <g id="tauri-logo">
      <circle cx="20" cy="20" r="18" fill="#7C4DFF" opacity="0.12" />
      <circle cx="16" cy="17" r="7.5" fill="none" stroke="#24C8DB" stroke-width="3" />
      <circle cx="24" cy="23" r="7.5" fill="none" stroke="#FFC131" stroke-width="3" />
    </g>

    <!-- SQLite Icon Vector -->
    <g id="sqlite-logo">
      <circle cx="20" cy="20" r="18" fill="#0284C7" opacity="0.15" />
      <ellipse cx="20" cy="12" rx="10" ry="3.5" fill="none" stroke="#0284C7" stroke-width="2.2" />
      <path d="M10 12V20C10 22 14.5 23.5 20 23.5C25.5 23.5 30 22 30 20V12" fill="none" stroke="#0284C7" stroke-width="2.2" />
      <path d="M10 20V28C10 30 14.5 31.5 20 31.5C25.5 31.5 30 30 30 28V20" fill="none" stroke="#0284C7" stroke-width="2.2" />
    </g>

    <!-- React Icon Vector -->
    <g id="react-logo">
      <circle cx="20" cy="20" r="18" fill="#0284C7" opacity="0.12" />
      <ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="#00D8FE" stroke-width="2.2" />
      <ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="#00D8FE" stroke-width="2.2" transform="rotate(60 20 20)" />
      <ellipse cx="20" cy="20" rx="14" ry="5.5" fill="none" stroke="#00D8FE" stroke-width="2.2" transform="rotate(120 20 20)" />
      <circle cx="20" cy="20" r="2.8" fill="#00D8FE" />
    </g>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="680" fill="url(#bg-grad)" rx="28" />

  <!-- Main Card Container -->
  <g class="card-shadow">
    <rect x="24" y="24" width="976" height="632" rx="24" fill="url(#card-grad)" stroke="#E2E8F0" stroke-width="1.5" />
  </g>

  <!-- Header Section -->
  <g id="header-brand">
    <!-- Official RxDesk Logo Vector (Rendered inside 94x94 squircle) -->
    <g transform="translate(52, 48)">
      <rect x="0" y="0" width="94" height="94" rx="24" fill="url(#rx-bg)" filter="drop-shadow(0 10px 20px rgba(15, 103, 180, 0.35))" />
      <rect x="3" y="3" width="88" height="88" rx="21" fill="none" stroke="#DFF4FF" stroke-opacity="0.25" stroke-width="2" />
      
      <!-- Scaled Official Vector Rx Icon from rxdesk.svg -->
      <g transform="translate(13, 13) scale(0.068)">
        <!-- "R" in White -->
        <path d="M334 320V704" stroke="#F8FCFF" stroke-width="86" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M334 320H510C600 320 666 385 666 476C666 567 600 632 510 632H406" stroke="#F8FCFF" stroke-width="86" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M506 632L698 806" stroke="#F8FCFF" stroke-width="86" stroke-linecap="round" stroke-linejoin="round" />
        <!-- "x" in Cyan -->
        <path d="M626 610L794 778" stroke="#91F3FF" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M794 610L626 778" stroke="#91F3FF" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Medical Cross Pill -->
        <circle cx="746" cy="286" r="62" fill="#E8FBFF" />
        <path d="M746 248V324" stroke="#0F67B4" stroke-width="36" stroke-linecap="round" />
        <path d="M708 286H784" stroke="#0F67B4" stroke-width="36" stroke-linecap="round" />
      </g>
    </g>

    <!-- App Title & Badges -->
    <text x="162" y="90" font-size="36" font-weight="800" fill="#0F172A" letter-spacing="-0.8px">RxDesk</text>

    <!-- Version Pill -->
    <rect x="312" y="68" width="68" height="26" rx="13" fill="#E0F2FE" />
    <text x="346" y="86" font-size="13" font-weight="700" fill="#0284C7" text-anchor="middle">v2.1.5</text>

    <!-- 14-Day Free Trial Pill -->
    <rect x="390" y="68" width="138" height="26" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1" />
    <text x="459" y="86" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">14-Day Free Trial</text>

    <!-- Subtitle -->
    <text x="162" y="118" font-size="16" font-weight="500" fill="#64748B" letter-spacing="-0.2px">High-Performance Offline-First Medical Prescription &amp; Clinic Management Suite</text>

    <!-- Header Right: MorningStar Web Official Branding -->
    <g transform="translate(710, 48)">
      <line x1="0" y1="6" x2="0" y2="76" stroke="#E2E8F0" stroke-width="1.5" />
      
      <!-- Four-point star emblem -->
      <g class="twinkle" transform="translate(36, 38)">
        <path d="M0 -22 C0 -6 6 0 22 0 C6 0 0 6 0 22 C0 6 -6 0 -22 0 C-6 0 0 -6 0 -22 Z" fill="url(#star-grad)" />
      </g>

      <g transform="translate(72, 28)">
        <text x="0" y="8" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.3px">MorningStar Web</text>
        <text x="0" y="27" font-size="12.5" font-weight="600" fill="#64748B" letter-spacing="0.4px">Software • Web • Applications</text>
      </g>
    </g>
  </g>

  <!-- Badges Row -->
  <g id="badges-row" transform="translate(52, 160)">
    <!-- 1. Release -->
    <rect x="0" y="0" width="128" height="36" rx="18" fill="url(#badge-green-grad)" stroke="#86EFAC" stroke-width="1" />
    <circle cx="18" cy="18" r="4.5" fill="#10B981" />
    <text x="30" y="22" font-size="12.5" font-weight="700" fill="#065F46">Release v2.1.5</text>

    <!-- 2. Platform -->
    <g transform="translate(136, 0)">
      <rect x="0" y="0" width="134" height="36" rx="18" fill="url(#badge-blue-grad)" stroke="#7DD3FC" stroke-width="1" />
      <path d="M16 13L21.5 12.2V17.2L16 17.3V13ZM16 18.5L21.5 18.6V23.7L16 22.9V18.5ZM22.5 12.1L29 11.2V17.1L22.5 17.2V12.1ZM22.5 18.6L29 18.7V24.7L22.5 23.8V18.6Z" fill="#0284C7"/>
      <text x="35" y="22" font-size="12" font-weight="700" fill="#075985">Windows 10 | 11</text>
    </g>

    <!-- 3. Engine -->
    <g transform="translate(278, 0)">
      <rect x="0" y="0" width="154" height="36" rx="18" fill="url(#badge-orange-grad)" stroke="#FDBA74" stroke-width="1" />
      <circle cx="18" cy="18" r="8" fill="#EA580C" opacity="0.2" />
      <text x="18" y="22" font-size="11" font-weight="900" fill="#C2410C" text-anchor="middle">R</text>
      <text x="32" y="22" font-size="12" font-weight="700" fill="#9A3412">Core Rust + Tauri v2</text>
    </g>

    <!-- 4. 14-Day Free Trial Badge -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="url(#badge-amber-grad)" stroke="#FCD34D" stroke-width="1" />
      <text x="16" y="22" font-size="13">🎁</text>
      <text x="34" y="22" font-size="12" font-weight="700" fill="#92400E">14-Day Free Trial</text>
    </g>

    <!-- 5. Security -->
    <g transform="translate(598, 0)">
      <rect x="0" y="0" width="112" height="36" rx="18" fill="url(#badge-purple-grad)" stroke="#D8B4FE" stroke-width="1" />
      <path d="M16 11L21 13V18C21 21 16 23 16 23C16 23 11 21 11 18V13L16 11Z" fill="#7C3AED" />
      <text x="30" y="22" font-size="12" font-weight="700" fill="#6B21A8">Ed25519 Bound</text>
    </g>

    <!-- 6. Quality Gate -->
    <g transform="translate(718, 0)">
      <rect x="0" y="0" width="108" height="36" rx="18" fill="url(#badge-green-grad)" stroke="#86EFAC" stroke-width="1" />
      <circle cx="16" cy="18" r="4.5" fill="#10B981" />
      <text x="28" y="22" font-size="12" font-weight="700" fill="#065F46">29/29 Pass</text>
    </g>

    <!-- 7. Tests -->
    <g transform="translate(834, 0)">
      <rect x="0" y="0" width="94" height="36" rx="18" fill="url(#badge-blue-grad)" stroke="#7DD3FC" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#0284C7" />
      <text x="26" y="22" font-size="12" font-weight="700" fill="#0369A1">48 Tests</text>
    </g>
  </g>

  <!-- Summary Description Paragraph -->
  <g transform="translate(52, 214)">
    <text x="0" y="14" font-size="15" font-weight="500" fill="#334155" letter-spacing="-0.1px">
      <tspan font-weight="700" fill="#0F172A">RxDesk</tspan> includes an instant <tspan font-weight="700" fill="#B45309">14-Day Free Evaluation</tspan> with full clinical features. Built with Tauri v2, SQLite WAL mode,
    </text>
    <text x="0" y="34" font-size="15" font-weight="500" fill="#334155" letter-spacing="-0.1px">
      in-process Axum HTTPS server, zero-config mDNS discovery, and sub-20ms pre-warming printing. Updates published to official release hub.
    </text>
  </g>

  <!-- Two Column Grid Cards -->
  <!-- Left Box: Key Clinical Features -->
  <g class="inner-shadow" transform="translate(52, 272)">
    <rect x="0" y="0" width="448" height="210" rx="18" fill="url(#box-grad)" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Title -->
    <g transform="translate(22, 22)">
      <text x="0" y="16" font-size="19">🩺</text>
      <text x="28" y="16" font-size="17" font-weight="800" fill="#0F172A">Key Clinical Features</text>
    </g>

    <!-- 5 Feature bullet items -->
    <g transform="translate(22, 60)">
      <!-- Item 1 -->
      <use href="#check-icon" x="0" y="0" />
      <text x="32" y="15" font-size="13.5" font-weight="600" fill="#1E293B">14-Day Free Evaluation (Instant Onboarding)</text>

      <!-- Item 2 -->
      <use href="#check-icon" x="0" y="28" />
      <text x="32" y="43" font-size="13.5" font-weight="600" fill="#1E293B">Rapid prescription &amp; adaptive AI suggestions</text>

      <!-- Item 3 -->
      <use href="#check-icon" x="0" y="56" />
      <text x="32" y="71" font-size="13.5" font-weight="600" fill="#1E293B">Instant &lt;20ms pre-warming print engine (GDI/ESC-POS)</text>

      <!-- Item 4 -->
      <use href="#check-icon" x="0" y="84" />
      <text x="32" y="99" font-size="13.5" font-weight="600" fill="#1E293B">Axum 0.8 HTTPS local server with mDNS auto-sync</text>

      <!-- Item 5 -->
      <use href="#check-icon" x="0" y="112" />
      <text x="32" y="127" font-size="13.5" font-weight="600" fill="#1E293B">100% offline autonomy &amp; Ed25519 hardware locking</text>
    </g>
  </g>

  <!-- Right Box: Tech Stack -->
  <g class="inner-shadow" transform="translate(524, 272)">
    <rect x="0" y="0" width="448" height="210" rx="18" fill="url(#box-grad)" stroke="#E2E8F0" stroke-width="1.2" />

    <!-- Title -->
    <g transform="translate(22, 22)">
      <text x="0" y="16" font-size="17" font-weight="800" fill="#0284C7">&lt;/&gt;</text>
      <text x="32" y="16" font-size="17" font-weight="800" fill="#0F172A">Tech Stack</text>
    </g>

    <!-- 4 Tech Icons Grid -->
    <g transform="translate(20, 68)">
      <!-- Rust -->
      <g transform="translate(14, 0)">
        <g class="float-1">
          <use href="#rust-logo" x="16" y="0" />
        </g>
        <text x="36" y="52" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Rust</text>
        <text x="36" y="68" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">(Tauri v2 / Axum)</text>
      </g>

      <!-- SQLite WAL -->
      <g transform="translate(114, 0)">
        <g class="float-2">
          <use href="#sqlite-logo" x="16" y="0" />
        </g>
        <text x="36" y="52" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">SQLite</text>
        <text x="36" y="68" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">(WAL / r2d2)</text>
      </g>

      <!-- React 19 -->
      <g transform="translate(214, 0)">
        <g class="float-1">
          <use href="#react-logo" x="16" y="0" />
        </g>
        <text x="36" y="52" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">React 19</text>
        <text x="36" y="68" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">(Doctor &amp; LAN)</text>
      </g>

      <!-- Tauri v2 -->
      <g transform="translate(314, 0)">
        <g class="float-2">
          <use href="#tauri-logo" x="16" y="0" />
        </g>
        <text x="36" y="52" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Tauri v2</text>
        <text x="36" y="68" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">(Native Desktop)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Box: Executive Summary & Releasing Highlights (v2.1.5) -->
  <g class="inner-shadow" transform="translate(52, 498)">
    <rect x="0" y="0" width="920" height="92" rx="16" fill="url(#box-grad)" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="0" y="0" width="5" height="92" rx="2" fill="#0D9488" />

    <g transform="translate(24, 22)">
      <text x="0" y="13" font-size="16">🚀</text>
      <text x="26" y="13" font-size="15" font-weight="800" fill="#0F172A">Official Release Hub &amp; Quality Report (v2.1.5)</text>
      
      <text x="0" y="38" font-size="13.5" font-weight="500" fill="#475569">
        Cleared 29/29 Quality Gates with 14-Day Free Evaluation. Every release is automatically signed and published to
      </text>
      <text x="0" y="56" font-size="13.5" font-weight="500" fill="#475569">
        the official release repository: github.com/rxdesk24x7/rxdesk-desktop-releases/releases.
      </text>
    </g>
  </g>

  <!-- Bottom Navigation Buttons Bar -->
  <g transform="translate(52, 604)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="144" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="14" y="21" font-size="13">🏛️</text>
    <text x="36" y="21" font-size="12" font-weight="700" fill="#334155">Architecture</text>

    <!-- Pill 2 -->
    <g transform="translate(152, 0)">
      <rect x="0" y="0" width="146" height="34" rx="17" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1" />
      <text x="14" y="21" font-size="13">🎁</text>
      <text x="36" y="21" font-size="12" font-weight="700" fill="#92400E">14-Day Free Trial</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(306, 0)">
      <rect x="0" y="0" width="146" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="14" y="21" font-size="13">🖨️</text>
      <text x="36" y="21" font-size="12" font-weight="700" fill="#334155">Print Engine</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(460, 0)">
      <rect x="0" y="0" width="148" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="14" y="21" font-size="13">📦</text>
      <text x="36" y="21" font-size="12" font-weight="700" fill="#334155">Releases Hub</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(616, 0)">
      <rect x="0" y="0" width="142" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="14" y="21" font-size="13">📋</text>
      <text x="36" y="21" font-size="12" font-weight="700" fill="#334155">Quality Gate</text>
    </g>

    <!-- Pill 6 -->
    <g transform="translate(766, 0)">
      <rect x="0" y="0" width="154" height="34" rx="17" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
      <text x="14" y="21" font-size="13">🌐</text>
      <text x="36" y="21" font-size="12" font-weight="700" fill="#0D9488">MorningStar Web</text>
    </g>
  </g>
</svg>